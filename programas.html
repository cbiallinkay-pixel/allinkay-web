    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const navMenuEl = document.getElementById('navMenu');
            if (hamburger && navMenuEl) {
                hamburger.addEventListener('click', () => { navMenuEl.classList.toggle('open'); hamburger.classList.toggle('active'); });
                navMenuEl.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { navMenuEl.classList.remove('open'); hamburger.classList.remove('active'); }));
            }
            const navLinks = document.querySelectorAll('nav ul li a');
            const lavalamp = document.querySelector('.lavalamp');
            const navUl = document.querySelector('nav ul');

            function moveLavalamp(el) {
                const linkRect = el.getBoundingClientRect();
                const ulRect = navUl.getBoundingClientRect();
                lavalamp.style.width = `${linkRect.width}px`;
                lavalamp.style.height = `${linkRect.height}px`;
                lavalamp.style.left = `${linkRect.left - ulRect.left}px`;
                lavalamp.style.top = `${linkRect.top - ulRect.top}px`;
                lavalamp.style.opacity = '1';

                if (el.dataset.color) {
                    lavalamp.style.backgroundColor = el.dataset.color;
                }
            }

            const activeItem = navLinks[3]; // Programas es el índice 3
            setTimeout(() => {
                moveLavalamp(activeItem);
            }, 50);

            navLinks.forEach(link => {
                link.addEventListener('mouseenter', (e) => {
                    moveLavalamp(e.target);
                });
            });

            navUl.addEventListener('mouseleave', () => {
                moveLavalamp(activeItem); 
            });

            window.addEventListener('resize', () => {
                moveLavalamp(activeItem);
            });
        });
    </script>

    <!-- Carga dinámica de Programas desde JSON -->
    <script>
        (function() {
            var REPO = 'cbiallinkay-pixel/allinkay-web';
            var BRANCH = 'main';
            var COLOR_MAP = {
                'blue':   { container: 'icon-blue-theme',   title: 'title-blue-theme' },
                'green':  { container: 'icon-green-theme',  title: 'title-green-theme' },
                'purple': { container: 'icon-purple-theme', title: 'title-purple-theme' },
                'teal':   { container: 'icon-teal-theme',   title: 'title-teal-theme' },
                'orange': { container: 'icon-orange-theme', title: 'title-orange-theme' },
                'red':    { container: 'icon-red-theme',    title: 'title-red-theme' }
            };

            function decodeBase64Utf8(base64) {
                var binary = atob((base64 || '').replace(/\s/g, ''));
                var len = binary.length;
                var bytes = new Uint8Array(len);
                for (var i = 0; i < len; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            }

            function renderProgramas(programas) {
                var grid = document.getElementById('programasGrid');
                if (!grid) return;
                if (!programas || !programas.length) {
                    grid.innerHTML = '<p style="color:#66788a;text-align:center;grid-column:1/-1;padding:40px 0;">No hay programas disponibles.</p>';
                    return;
                }
                grid.innerHTML = programas.map(function(p) {
                    var theme = COLOR_MAP[p.color] || COLOR_MAP['blue'];
                    var icono = p.icono || 'fa-star';
                    var mediaHtml = '';
                    var hasPhoto = Boolean(p.imagen && p.imagen.trim());
                    if (hasPhoto) {
                        var imgSrc = p.imagen.trim();
                        var fullSrc = imgSrc.startsWith('http') ? imgSrc : 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + imgSrc;
                        mediaHtml = '<div class="programa-card-media">' +
                            '<img src="' + fullSrc + '" alt="' + (p.titulo || '') + '" class="programa-card-img" loading="lazy">' +
                            '</div>';
                    }
                    return '<div class="programa-card' + (hasPhoto ? ' with-photo' : '') + '">' +
                        mediaHtml +
                        '<div class="programa-card-inner">' +
                        '<div class="programa-icon-container ' + theme.container + '">' +
                        '<i class="fa-solid ' + icono + '"></i>' +
                        '</div>' +
                        '<div class="programa-content">' +
                        '<h3 class="' + theme.title + '">' + (p.titulo || '') + '</h3>' +
                        '<p>' + (p.descripcion || '') + '</p>' +
                        '</div>' +
                        '</div>' +
                        '</div>';
                }).join('');
            }

            var apiUrl = 'https://api.github.com/repos/' + REPO + '/contents/_data/programas.json?ref=' + BRANCH + '&t=' + Date.now();
            var rawUrl = 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/_data/programas.json?t=' + Date.now();

            fetch(apiUrl)
                .then(function(r) {
                    if (!r.ok) throw new Error('API HTTP ' + r.status);
                    return r.json();
                })
                .then(function(data) {
                    var parsed = JSON.parse(decodeBase64Utf8(data.content));
                    renderProgramas(parsed.programas || []);
                })
                .catch(function() {
                    // Fallback a raw.githubusercontent.com
                    fetch(rawUrl)
                        .then(function(r) { return r.json(); })
                        .then(function(data) { renderProgramas(data.programas || []); })
                        .catch(function() {
                            var grid = document.getElementById('programasGrid');
                            if (grid) grid.innerHTML = '<p style="color:#66788a;text-align:center;grid-column:1/-1;padding:40px 0;">No se pudieron cargar los programas.</p>';
                        });
                });
        })();
    </script>
