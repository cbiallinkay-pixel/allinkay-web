    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const navMenuEl = document.getElementById('navMenu');
            if (hamburger && navMenuEl) {
                hamburger.addEventListener('click', () => { navMenuEl.classList.toggle('open'); hamburger.classList.toggle('active'); });
                navMenuEl.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { navMenuEl.classList.remove('open'); hamburger.classList.remove('active'); }));
            }
            const navLinks = document.querySelectorAll('nav ul li a');
            const lavalamp = document.querySelector('.lavalamp');
            const navUl = document.querySelector('nav ul');

            function moveLavalamp(el) {
                const linkRect = el.getBoundingClientRect();
                const ulRect = navUl.getBoundingClientRect();
                lavalamp.style.width = `${linkRect.width}px`;
                lavalamp.style.height = `${linkRect.height}px`;
                lavalamp.style.left = `${linkRect.left - ulRect.left}px`;
                lavalamp.style.top = `${linkRect.top - ulRect.top}px`;
                lavalamp.style.opacity = '1';

                if (el.dataset.color) {
                    lavalamp.style.backgroundColor = el.dataset.color;
                }
            }

            const activeItem = navLinks[3]; // Programas es el índice 3
            setTimeout(() => {
                moveLavalamp(activeItem);
            }, 50);

            navLinks.forEach(link => {
                link.addEventListener('mouseenter', (e) => {
                    moveLavalamp(e.target);
                });
            });

            navUl.addEventListener('mouseleave', () => {
                moveLavalamp(activeItem); 
            });

            window.addEventListener('resize', () => {
                moveLavalamp(activeItem);
            });
        });
    </script>

    <!-- Carga dinámica de Programas desde JSON -->
    <script>
        (function() {
            var REPO = 'cbiallinkay-pixel/allinkay-web';
            var BRANCH = 'main';
            var COLOR_MAP = {
                'blue':   { container: 'icon-blue-theme',   title: 'title-blue-theme' },
                'green':  { container: 'icon-green-theme',  title: 'title-green-theme' },
                'purple': { container: 'icon-purple-theme', title: 'title-purple-theme' },
                'teal':   { container: 'icon-teal-theme',   title: 'title-teal-theme' },
                'orange': { container: 'icon-orange-theme', title: 'title-orange-theme' },
                'red':    { container: 'icon-red-theme',    title: 'title-red-theme' }
            };

            function decodeBase64Utf8(base64) {
                var binary = atob((base64 || '').replace(/\s/g, ''));
                var len = binary.length;
                var bytes = new Uint8Array(len);
                for (var i = 0; i < len; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            }

            window._allProgramas = [];

            function renderProgramas(programas) {
                window._allProgramas = programas || [];
                var grid = document.getElementById('programasGrid');
                if (!grid) return;
                if (!programas || !programas.length) {
                    grid.innerHTML = '<p style="color:#66788a;text-align:center;grid-column:1/-1;padding:40px 0;">No hay programas disponibles.</p>';
                    return;
                }
                grid.innerHTML = programas.map(function(p, idx) {
                    var theme = COLOR_MAP[p.color] || COLOR_MAP['blue'];
                    var icono = p.icono || 'fa-star';
                    var mediaHtml = '';
                    var hasPhoto = Boolean(p.imagen && p.imagen.trim());
                    if (hasPhoto) {
                        var imgSrc = p.imagen.trim();
                        var fullSrc = imgSrc.startsWith('http') ? imgSrc : imgSrc;
                        mediaHtml = '<div class="programa-card-media">' +
                            '<img src="' + fullSrc + '" alt="' + (p.titulo || '') + '" class="programa-card-img" loading="lazy" onerror="if(!this.dataset.tried){this.dataset.tried=1;this.src=\'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/\' + \'' + imgSrc + '\';}">' +
                            '</div>';
                    }
                    return '<div class="programa-card' + (hasPhoto ? ' with-photo' : '') + '" onclick="openProgramaModal(' + idx + ')" title="Clic para ver más información y fotos">' +
                        mediaHtml +
                        '<div class="programa-card-inner">' +
                        '<div class="programa-icon-container ' + theme.container + '">' +
                        '<i class="fa-solid ' + icono + '"></i>' +
                        '</div>' +
                        '<div class="programa-content">' +
                        '<h3 class="' + theme.title + '">' + (p.titulo || '') + '</h3>' +
                        '<p>' + (p.descripcion || '') + '</p>' +
                        '<span class="programa-ver-mas">Ver más detalles <i class="fa-solid fa-arrow-right"></i></span>' +
                        '</div>' +
                        '</div>' +
                        '</div>';
                }).join('');
            }

            function openProgramaFotoLightbox(src) {
                var box = document.getElementById('programaFotoLightbox');
                var img = document.getElementById('programaFotoLightboxImg');
                if (!box || !img || !src) return;
                img.src = src;
                box.classList.add('show');
            }

            function closeProgramaFotoLightbox() {
                var box = document.getElementById('programaFotoLightbox');
                var img = document.getElementById('programaFotoLightboxImg');
                if (box) box.classList.remove('show');
                if (img) img.src = '';
            }

            window.openProgramaModal = function(idx) {
                var p = window._allProgramas && window._allProgramas[idx];
                if (!p) return;
                var modal = document.getElementById('programaModal');
                var modalImgWrap = document.getElementById('modalImgWrap');
                var modalTag = document.getElementById('modalTag');
                var modalTitle = document.getElementById('modalTitle');
                var modalDesc = document.getElementById('modalDesc');
                var modalWhatsapp = document.getElementById('modalWhatsapp');

                modalTitle.textContent = p.titulo || 'Programa';
                modalDesc.textContent = p.descripcion || '';
                modalTag.textContent = 'Programa Allinkay';
                modalImgWrap.style.display = '';
                modalImgWrap.style.alignItems = '';
                modalImgWrap.style.justifyContent = '';
                modalImgWrap.style.background = '';

                if (p.imagen && p.imagen.trim()) {
                    var imgSrc = p.imagen.trim();
                    var fullSrc = imgSrc.startsWith('http') ? imgSrc : imgSrc;
                    modalImgWrap.classList.remove('has-icon');
                    modalImgWrap.innerHTML = '<img id="modalImg" src="' + fullSrc + '" alt="' + (p.titulo || '') + '" onclick="event.stopPropagation();" onerror="if(!this.dataset.tried){this.dataset.tried=1;this.src=\'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/\' + \'' + imgSrc + '\';}">';
                    var modalImg = document.getElementById('modalImg');
                    if (modalImg) {
                        modalImg.addEventListener('click', function(e) {
                            e.stopPropagation();
                            openProgramaFotoLightbox(this.src);
                        });
                    }
                } else {
                    modalImgWrap.classList.add('has-icon');
                    modalImgWrap.style.background = 'linear-gradient(135deg, #0ea5e9, #0f766e)';
                    modalImgWrap.innerHTML = '<i class="fa-solid ' + (p.icono || 'fa-star') + '" style="font-size:4rem;color:#ffffff;"></i>';
                }

                modalWhatsapp.href = 'https://wa.me/593988282747?text=' + encodeURIComponent('Hola Fundación Allinkay, quisiera más información sobre el programa: ' + (p.titulo || ''));
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            };

            window.closeProgramaModal = function() {
                closeProgramaFotoLightbox();
                var modal = document.getElementById('programaModal');
                if (modal) modal.classList.remove('active');
                document.body.style.overflow = 'auto';
            };

            var modalCloseBtn = document.getElementById('modalClose');
            if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeProgramaModal);
            var progModal = document.getElementById('programaModal');
            if (progModal) progModal.addEventListener('click', function(e) { if (e.target === progModal) closeProgramaModal(); });
            var fotoBox = document.getElementById('programaFotoLightbox');
            var fotoClose = document.getElementById('closeProgramaFotoLightbox');
            if (fotoClose) fotoClose.addEventListener('click', function(e) { e.stopPropagation(); closeProgramaFotoLightbox(); });
            if (fotoBox) fotoBox.addEventListener('click', function(e) { if (e.target === fotoBox) closeProgramaFotoLightbox(); });
            document.addEventListener('keydown', function(e) {
                if (e.key !== 'Escape') return;
                if (fotoBox && fotoBox.classList.contains('show')) closeProgramaFotoLightbox();
                else closeProgramaModal();
            });

            var apiUrl = 'https://api.github.com/repos/' + REPO + '/contents/_data/programas.json?ref=' + BRANCH + '&t=' + Date.now();
            var rawUrl = 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/_data/programas.json?t=' + Date.now();

            fetch(apiUrl)
                .then(function(r) {
                    if (!r.ok) throw new Error('API HTTP ' + r.status);
                    return r.json();
                })
                .then(function(data) {
                    var parsed = JSON.parse(decodeBase64Utf8(data.content));
                    renderProgramas(parsed.programas || []);
                })
                .catch(function() {
                    // Fallback a raw.githubusercontent.com
                    fetch(rawUrl)
                        .then(function(r) { return r.json(); })
                        .then(function(data) { renderProgramas(data.programas || []); })
                        .catch(function() {
                            var grid = document.getElementById('programasGrid');
                            if (grid) grid.innerHTML = '<p style="color:#66788a;text-align:center;grid-column:1/-1;padding:40px 0;">No se pudieron cargar los programas.</p>';
                        });
                });
        })();
    </script>
